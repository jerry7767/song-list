<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>小卡比音樂清單</title>

<style>
body {
    font-family: sans-serif;
    padding: 20px;
}

li {
    margin: 5px 0;
}
</style>

</head>

<body>

<h1>小卡比音樂清單</h1>

<ul id="list"></ul>

<script>
fetch("list.txt")
.then(response => response.text())
.then(text => {
    const files = text.split("\n");
    const list = document.getElementById("list");

    files.forEach(file => {
        if(file.trim()){
            let li = document.createElement("li");
            li.textContent = file;
            list.appendChild(li);
        }
    });
});
</script>

</body>
</html>
